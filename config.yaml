# IBM MQ Usage Report Generator — Configuration
# API token should always be passed via env var, never committed here.

splunk_observability:
  realm: "us1"                     # e.g. us0, us1, eu0 — determines stream.<realm>.signalfx.com
  api_token: "${SFX_API_TOKEN}"    # org or user API access token with metrics read scope

metric:
  name: "ibm.mq.message.deq.count"   # dequeue count (requires MQ queue statistics enabled)
  # false because the OTel ibm-mq-metrics receiver populates this via IBM MQ's
  # RESET QSTATS PCF command, which resets the counter on every read — so each
  # datapoint is already "messages dequeued since the last reset", not a
  # running cumulative total. Sum the raw values directly; do not delta() them.
  # See README "Metric type caveat" if you're on a different collector version
  # and Metric Finder shows this metric's Type as COUNTER instead of GAUGE.
  is_cumulative_counter: false
  group_by:
    # Per open-telemetry/opentelemetry-java-contrib ibm-mq-metrics docs.
    - "ibm.mq.queue.manager"
    - "messaging.destination.name"
  filters:
    # Optional: restrict to specific queue managers. Empty = all.
    ibm.mq.queue.manager: []
    # ibm.mq.queue.manager: ["MQU1"]

report:
  output_dir: "./reports"
  formats: ["xlsx", "pdf"]
  title: "IBM MQ Message Throughput Report"
  # Granularity of the trend breakdown: hourly/daily/weekly/monthly.
  # Pick something coarse enough not to produce an unwieldy table for the
  # period length (e.g. "monthly" for --period year).
  trend_granularity: "daily"

dashboard:
  group_name: "IBM MQ Usage Reports"
  dashboard_name: "IBM MQ Message Throughput"
  chart_name: "Messages Dequeued by Queue Manager / Queue"
